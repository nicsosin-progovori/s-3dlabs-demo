limit_req_zone $binary_remote_addr zone=threedlabs_png:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=threedlabs_upload:1m rate=12r/m;

server {
    listen 80;
    server_name 3d.progovori.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/3dlabs/acme;
        default_type text/plain;
    }
    location / { return 301 https://3d.progovori.ru$request_uri; }
}

server {
    listen 443 ssl;
    server_name 3d.progovori.ru;
    ssl_certificate /etc/letsencrypt/live/3dlabs-progovori/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3dlabs-progovori/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:threedlabs_tls:1m;
    ssl_session_timeout 1d;
    client_max_body_size 18m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location = / { return 302 /bottle.html; }
    location = /render.html { return 404; }
    location = /api/render {
        limit_req zone=threedlabs_png burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/3dlabs-proxy.inc;
    }
    location = /api/logos {
        limit_req zone=threedlabs_upload burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/3dlabs-proxy.inc;
    }
    location / { include /etc/nginx/3dlabs-proxy.inc; }
}

events {}
http {
  upstream web      { server web:5180; }
  upstream renderer { server renderer:5181; }
  server {
    listen 80;
    client_max_body_size 20m;              # загрузка логотипов
    location = /api/render {
      proxy_pass http://renderer;
      proxy_read_timeout 120s;
    }
    location / { proxy_pass http://web; }
  }
}
